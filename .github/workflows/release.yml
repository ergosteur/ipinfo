name: Release Docker Image

on:
  push:
    tags:
      - "v*"

env:
  # Use secrets for the username to allow flexibility
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/ipinfo

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Strip build-number suffix from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME%-4.10.222A}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # Git tags look like v0.2.2-4.10.222A. The exact "-4.10.222A" suffix (a gag build
          # number) is stripped above, and the rest gets normal semver handling:
          #   v0.2.2-4.10.222A       -> 0.2.2, 0.2, latest
          #   v1.0.0-rc1-4.10.222A   -> 1.0.0-rc1 (pre-releases get no 1.0 or latest)
          tags: |
            type=semver,pattern={{version}},value=${{ steps.ver.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ver.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          short-description: "Modern, themed 'What is my IP' service with JSON/CSV/Text support and Windows 98 theme."
          readme-filepath: ./README.md
